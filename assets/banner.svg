<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#1a2333"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .metric-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #38bdf8; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes barGrow {
      0%, 100% { height: 40px; }
      50% { height: 70px; }
    }

    .pulsing-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: floatCard 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard 6s ease-in-out infinite 1s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Animated Background Orbs -->
  <circle cx="200" cy="100" r="180" fill="#6366f1" opacity="0.25" class="pulsing-orb" filter="url(#glow)"/>
  <circle cx="1000" cy="320" r="220" fill="#ec4899" opacity="0.2" class="pulsing-orb" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="140" fill="#06b6d4" opacity="0.2" class="pulsing-orb" filter="url(#glow)"/>

  <!-- Grid overlay for tech look -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#334155" stroke-opacity="0.15" stroke-width="1"/>
  <path d="M150 0 V420 M300 0 V420 M450 0 V420 M600 0 V420 M750 0 V420 M900 0 V420 M1050 0 V420" stroke="#334155" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Decorative Background Graphical UI Elements (In Background Layer) -->
  <g filter="url(#shadow)" opacity="0.85">
    <!-- Feedback Analytics Floating Card -->
    <g class="floating-card-1" transform="translate(820, 50)">
      <rect width="320" height="140" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" class="metric-label">CSAT &amp; NPS INSIGHTS</text>
      <text x="20" y="65" class="metric-value">+78 NPS Score</text>
      <path d="M20 95 C 70 75, 120 110, 170 85 C 220 60, 270 95, 300 70" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="300" cy="70" r="5" fill="#38bdf8" filter="url(#glow)"/>
    </g>

    <!-- Survey Response Metric Card -->
    <g class="floating-card-2" transform="translate(860, 210)">
      <rect width="280" height="150" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" class="metric-label">FEEDBACK VOLUME</text>
      <text x="20" y="62" class="metric-value" fill="#10b981">1.2M+ Responses</text>

      <!-- Bar Chart inside Card -->
      <rect x="20" y="110" width="18" height="30" rx="4" fill="#6366f1"/>
      <rect x="48" y="95" width="18" height="45" rx="4" fill="#8b5cf6"/>
      <rect x="76" y="80" width="18" height="60" rx="4" fill="#38bdf8"/>
      <rect x="104" y="90" width="18" height="50" rx="4" fill="#ec4899"/>
      <rect x="132" y="70" width="18" height="70" rx="4" fill="#10b981"/>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Header & Typography (Ensured Always Visible On Top) -->
  <g transform="translate(60, 75)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="32" rx="16" fill="url(#primaryGrad)" opacity="0.9"/>
      <text x="16" y="21" class="badge-text" fill="#ffffff">🔥 AWESOME CUSTOMER FEEDBACK</text>
    </g>

    <!-- Title -->
    <text x="0" y="90" class="title">Customer Feedback</text>
    <text x="0" y="142" class="title" fill="url(#primaryGrad)">Management Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Curated SaaS Platforms, NPS/CSAT Engines &amp; Open-Source Infrastructure</text>

    <!-- Feature Pill Tags -->
    <g transform="translate(0, 220)">
      <!-- Pill 1 -->
      <g transform="translate(0,0)">
        <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="5" fill="#10b981"/>
        <text x="32" y="22" class="badge-text">NPS &amp; CSAT</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142,0)">
        <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
        <text x="32" y="22" class="badge-text">In-App Widgets</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(314,0)">
        <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="5" fill="#ec4899"/>
        <text x="32" y="22" class="badge-text">Feedback Boards</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(496,0)">
        <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="17" r="5" fill="#8b5cf6"/>
        <text x="32" y="22" class="badge-text">Open Source</text>
      </g>
    </g>
  </g>
</svg>
